[project]
name = "radlermass"
version = "0.3.0"
description = "Go binaries in Python wheels."
readme = "README.md"
# Includes Apache-2.0 code derived from go-to-wheel; see NOTICE.
license = "(MIT OR Apache-2.0) AND Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]
authors = [
    { name = "William Woodruff", email = "william@yossarian.net" }
]
requires-python = ">=3.14"
dependencies = [
    "packaging>=26.0",
]

[project.scripts]
radlermass = "radlermass._cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
require-build-hashes = true
preview-features = ["build-dependency-hashes"]
