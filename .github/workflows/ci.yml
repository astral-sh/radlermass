name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  zizmor:
    uses: $/.github/workflows/zizmor.yml
    permissions:
      contents: read
